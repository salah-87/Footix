# Continuous integration: on every push and pull request, build the database
# from the SQL scripts and run all the tests (API, MongoDB logs, front helpers).
name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:                       # same account and database as tests/setup-env.js
          POSTGRES_USER: footix
          POSTGRES_PASSWORD: footix_dev
          POSTGRES_DB: footix_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    env:
      NODE_ENV: test
      MONGO_TEST_URL: mongodb://localhost:27017/footix_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high   # fail on known vulnerable dependencies
      - run: npm test
      - run: npm run test:front
