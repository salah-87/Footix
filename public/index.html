<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Footix | Billetterie du Stade Municipal</title>
  <meta name="description" content="Achetez vos places numérotées pour les matchs du Stade Municipal de Limoges.">
  <link rel="preload" href="/fonts/archivo-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/fraunces-variable.woff2" as="font" type="font/woff2" crossorigin>
  <meta name="theme-color" content="#0b1f4b">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/themes/prestige.css">
</head>
<body>
  <a class="skip-link" href="#contenu">Aller au contenu</a>
  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="/">Footix</a>
      <nav class="site-nav" aria-label="Navigation principale">
        <ul>
          <li><a href="/" data-page="matchs">Matchs</a></li>
          <li data-role="connecte" hidden><a href="/billets" data-page="billets">Mes billets</a></li>
          <li data-role="controle" hidden><a href="/controle" data-page="controle">Contrôle</a></li>
          <li data-role="admin" hidden><a href="/admin" data-page="admin">Administration</a></li>
          <li data-role="anonyme"><a href="/connexion" data-page="connexion">Se connecter</a></li>
          <li data-role="connecte" hidden><span class="who" id="qui"></span></li>
          <li data-role="connecte" hidden><button type="button" id="deconnexion">Se déconnecter</button></li>
        </ul>
      </nav>
    </div>
  </header>
  <main id="contenu" tabindex="-1">
    <div class="wrap">
      <p id="message" class="message" role="status" tabindex="-1"></p>
      <section id="affiche" class="affiche" aria-label="Prochain match"></section>
      <section id="autres" aria-labelledby="titre-autres" hidden>
        <h2 id="titre-autres">Les matchs suivants</h2>
        <ul id="calendrier" class="calendrier"></ul>
      </section>
    </div>
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p>Footix, billetterie du Stade Municipal de Limoges. Projet de formation : les paiements sont simulés.</p>
    </div>
  </footer>
  <script type="module" src="/js/home.js"></script>
</body>
</html>
